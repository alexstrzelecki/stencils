blueprint:
  name: "Philips Hue Dimmer Remote (929002398602) / Action Mapper"
  description: >
    Map Philips Hue dimmer remote actions to independent action sequences.
    Supported actions: on_press, on_hold, on_press_release, on_hold_release,
    off_press, off_hold, off_press_release, off_hold_release,
    up_press, up_hold, up_press_release, up_hold_release,
    down_press, down_hold, down_press_release, down_hold_release,
    recall_0, recall_1.
  domain: automation
  input:
    device:
      name: Button device
      selector:
        device: {}
    device_domain:
      name: Device integration domain
      description: "Integration domain used by the device trigger (e.g. mqtt, zha, deconz, zigbee2mqtt)."
      default: "mqtt"
      selector:
        text: {}

    on_press:
      name: on_press action
      selector:
        action: {}
      default: []
    on_hold:
      name: on_hold action
      selector:
        action: {}
      default: []
    on_press_release:
      name: on_press_release action
      selector:
        action: {}
      default: []
    on_hold_release:
      name: on_hold_release action
      selector:
        action: {}
      default: []

    off_press:
      name: off_press action
      selector:
        action: {}
      default: []
    off_hold:
      name: off_hold action
      selector:
        action: {}
      default: []
    off_press_release:
      name: off_press_release action
      selector:
        action: {}
      default: []
    off_hold_release:
      name: off_hold_release action
      selector:
        action: {}
      default: []

    up_press:
      name: up_press action
      selector:
        action: {}
      default: []
    up_hold:
      name: up_hold action
      selector:
        action: {}
      default: []
    up_press_release:
      name: up_press_release action
      selector:
        action: {}
      default: []
    up_hold_release:
      name: up_hold_release action
      selector:
        action: {}
      default: []

    down_press:
      name: down_press action
      selector:
        action: {}
      default: []
    down_hold:
      name: down_hold action
      selector:
        action: {}
      default: []
    down_press_release:
      name: down_press_release action
      selector:
        action: {}
      default: []
    down_hold_release:
      name: down_hold_release action
      selector:
        action: {}
      default: []

    recall_0:
      name: recall_0 action
      selector:
        action: {}
      default: []
    recall_1:
      name: recall_1 action
      selector:
        action: {}
      default: []

trigger:
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "on_press"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "on_hold"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "on_press_release"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "on_hold_release"

  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "off_press"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "off_hold"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "off_press_release"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "off_hold_release"

  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "up_press"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "up_hold"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "up_press_release"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "up_hold_release"

  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "down_press"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "down_hold"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "down_press_release"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "down_hold_release"

  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "recall_0"
  - platform: device
    device_id: !input device
    domain: !input device_domain
    type: action
    subtype: "recall_1"

action:
  - variables:
      action_value: >-
        {% if trigger.subtype is defined %}
          {{ trigger.subtype }}
        {% elif trigger.payload is defined %}
          {{ trigger.payload }}
        {% elif trigger.event is defined and trigger.event.data is defined and trigger.event.data.action is defined %}
          {{ trigger.event.data.action }}
        {% elif trigger.event is defined and trigger.event.data is defined and trigger.event.data.payload is defined %}
          {% set p = trigger.event.data.payload %}
          {% if p is string %}
            {% set j = p | from_json %}
          {% else %}
            {% set j = p %}
          {% endif %}
          {{ j.action if j is mapping and 'action' in j else '' }}
        {% else %}
          ''
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'on_press' }}"
        sequence: !input on_press
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'on_hold' }}"
        sequence: !input on_hold
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'on_press_release' }}"
        sequence: !input on_press_release
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'on_hold_release' }}"
        sequence: !input on_hold_release

      - conditions:
          - condition: template
            value_template: "{{ action_value == 'off_press' }}"
        sequence: !input off_press
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'off_hold' }}"
        sequence: !input off_hold
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'off_press_release' }}"
        sequence: !input off_press_release
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'off_hold_release' }}"
        sequence: !input off_hold_release

      - conditions:
          - condition: template
            value_template: "{{ action_value == 'up_press' }}"
        sequence: !input up_press
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'up_hold' }}"
        sequence: !input up_hold
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'up_press_release' }}"
        sequence: !input up_press_release
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'up_hold_release' }}"
        sequence: !input up_hold_release

      - conditions:
          - condition: template
            value_template: "{{ action_value == 'down_press' }}"
        sequence: !input down_press
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'down_hold' }}"
        sequence: !input down_hold
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'down_press_release' }}"
        sequence: !input down_press_release
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'down_hold_release' }}"
        sequence: !input down_hold_release

      - conditions:
          - condition: template
            value_template: "{{ action_value == 'recall_0' }}"
        sequence: !input recall_0
      - conditions:
          - condition: template
            value_template: "{{ action_value == 'recall_1' }}"
        sequence: !input recall_1

    default: []

mode: single
